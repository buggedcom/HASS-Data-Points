<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220" />
      <stop offset="1" stop-color="#0f1b2d" />
    </linearGradient>
    <style>
      .title { font: 700 72px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji", "Segoe UI Emoji"; fill: #e6f1ff; }
      .subtitle { font: 500 34px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji", "Segoe UI Emoji"; fill: #a9bbd6; }
      .meta { font: 600 28px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji", "Segoe UI Emoji"; fill: #7fa0c7; }
      .badge { font: 700 24px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji", "Segoe UI Emoji"; fill: #06101f; }
      .stroke { stroke: #2a3f60; stroke-width: 3; }
      .soft { fill: rgba(255,255,255,0.05); }
      .brand { fill: #03a9f4; }
      .chip { font: 700 22px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #e6f1ff; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)" />

  <g transform="translate(96,96)">
    <rect x="0" y="0" width="1728" height="888" rx="28" class="soft stroke" />

    <text x="72" y="138" class="title">Range Toolbar (Zoom / Snap / Live Edge)</text>
    <text x="72" y="202" class="subtitle">Replace this placeholder with a real screenshot.</text>
    <text x="72" y="272" class="meta">File: range-toolbar-zoom-snap-live-edge.png</text>

    <g transform="translate(72,340)">
      <rect x="0" y="0" width="1584" height="460" rx="22" class="soft stroke" />
      <rect x="72" y="86" width="1440" height="78" rx="18" fill="rgba(255,255,255,0.08)" class="stroke" />
      <rect x="108" y="108" width="180" height="34" rx="17" class="brand" opacity="0.85" />
      <text x="124" y="134" class="chip">Zoom</text>
      <rect x="320" y="108" width="220" height="34" rx="17" class="brand" opacity="0.45" />
      <text x="336" y="134" class="chip">Snap</text>
      <rect x="572" y="108" width="260" height="34" rx="17" class="brand" opacity="0.25" />
      <text x="588" y="134" class="chip">Live Edge</text>
      <text x="72" y="220" class="meta">Primary shot: show current zoom level, date snapping unit, and live-edge indicator.</text>
    </g>

    <g transform="translate(72,836)">
      <rect x="0" y="0" width="390" height="58" rx="14" fill="#03a9f4" />
      <text x="22" y="38" class="badge">PLACEHOLDER</text>
    </g>
  </g>
</svg>

