<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220" />
      <stop offset="1" stop-color="#0f1b2d" />
    </linearGradient>
    <style>
      .title { font: 700 72px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #e6f1ff; }
      .subtitle { font: 500 34px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #a9bbd6; }
      .meta { font: 600 28px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #7fa0c7; }
      .badge { font: 700 24px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #06101f; }
      .stroke { stroke: #2a3f60; stroke-width: 3; }
      .soft { fill: rgba(255,255,255,0.05); }
      .brand { fill: #03a9f4; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)" />

  <g transform="translate(96,96)">
    <rect x="0" y="0" width="1728" height="888" rx="28" class="soft stroke" />

    <text x="72" y="138" class="title">Multi-target Chart + Comparison Window</text>
    <text x="72" y="202" class="subtitle">Replace this placeholder with a real screenshot.</text>
    <text x="72" y="272" class="meta">File: multi-target-comparison-window.png</text>

    <g transform="translate(72,340)">
      <rect x="0" y="0" width="1584" height="460" rx="22" class="soft stroke" />
      <rect x="72" y="84" width="1440" height="260" rx="18" fill="rgba(255,255,255,0.06)" class="stroke" />
      <path d="M 96 300 C 220 220, 320 280, 420 240 S 640 220, 780 260 S 980 310, 1120 250 S 1320 210, 1488 240" fill="none" stroke="#03a9f4" stroke-width="5" opacity="0.85" />
      <path d="M 96 260 C 260 180, 380 320, 520 240 S 740 200, 900 280 S 1100 340, 1260 240 S 1380 200, 1488 220" fill="none" stroke="#8bd6ff" stroke-width="5" opacity="0.65" />
      <rect x="980" y="84" width="260" height="260" fill="#03a9f4" opacity="0.10" />
      <text x="72" y="390" class="meta">Primary shot: multiple targets visible and a comparison window overlay or tabs enabled.</text>
    </g>

    <g transform="translate(72,836)">
      <rect x="0" y="0" width="390" height="58" rx="14" fill="#03a9f4" />
      <text x="22" y="38" class="badge">PLACEHOLDER</text>
    </g>
  </g>
</svg>

